<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">

<body>
    <div class="sidebar" th:fragment="sidebar">

            <li><a th:href="@{/reports/budget}">Unit Budget</a></li>
        </ul>

    <div th:fragment="topbar">

                <span>System Administrator</span>
