<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Issue Certificate')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <h2>Issue Certificate</h2>
                <a th:href="@{/certificates}" class="btn-outline">Back to List</a>
            </div>
            
            <div class="form-container panel">
                <form th:action="@{/certificates/issue}" th:object="${certificateRequest}" method="post">
                    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    
                    <div class="form-group">
                        <label>Certificate Number (Unique)</label>
                        <input type="text" th:field="*{certificateNumber}" class="form-control" placeholder="e.g. CERT-2026-001" required/>
                        <span th:if="${#fields.hasErrors('certificateNumber')}" th:errors="*{certificateNumber}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" th:field="*{studentId}" class="form-control" placeholder="e.g. STD-9921" required/>
                        <span th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Recipient Name</label>
                        <input type="text" th:field="*{studentName}" class="form-control" placeholder="Full Name" required/>
                        <span th:if="${#fields.hasErrors('studentName')}" th:errors="*{studentName}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Institution</label>
                        <input type="text" th:field="*{institution}" class="form-control" placeholder="e.g. Institute of Technology" required/>
                    </div>
                    
                    <div class="form-group">
                        <label>Course Name</label>
                        <input type="text" th:field="*{course}" class="form-control" placeholder="e.g. B.Tech Computer Science" required/>
                    </div>
                    
                    <div class="form-group">
                        <label>Grade / Classification</label>
                        <input type="text" th:field="*{grade}" class="form-control" placeholder="e.g. First Class Honours" required/>
                    </div>
                    
                    <div class="form-group">
                        <label>Issuer Name/Designation</label>
                        <input type="text" th:field="*{issuer}" class="form-control" placeholder="e.g. Registrar, University Board" required/>
                    </div>
                    
                    <div class="form-group">
                        <label>Issue Date</label>
                        <input type="date" th:field="*{issueDate}" class="form-control" required/>
                    </div>
                    
                    <div style="margin-top: 32px;">
                        <button type="submit" class="btn-primary" style="width: 100%;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                            Issue Cryptographic Credential
                        </button>
                    </div>
                </form>
            </div>
    </div>
</body>
</html>
