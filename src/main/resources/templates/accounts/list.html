<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accounts')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area panel">
            <div class="page-header">
                <h2>Chart of Accounts</h2>
                <a th:href="@{/accounts/new}" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Account
                </a>
            </div>
            
            <div class="panel table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Account ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="acc : ${accounts}">
                            <td th:text="${acc.accountId}">1</td>
                            <td th:text="${acc.accountName}" style="font-weight: 500; color: var(--navy-deep);">Name</td>
                            <td>
                                <span class="badge" th:classappend="${acc.accountType.name() == 'ASSET' or acc.accountType.name() == 'REVENUE' ? 'badge-success' : 'badge-warning'}" th:text="${acc.accountType}">Type</span>
                            </td>
                            <td th:text="${'₹' + #numbers.formatDecimal(acc.currentBalance, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                            <td>
                                <a th:href="@{/accounts/edit/{id}(id=${acc.accountId})}" class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;">Edit</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                No accounts found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>
</body>
</html>
