<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Platform P&L')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <h2>Platform P&L</h2>
            </div>
            
            <div class="table-container" style="max-width: 600px;">
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th style="text-align: right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: 500;">Total Revenue</td>
                            <td style="text-align: right; color: var(--emerald-success); font-weight: 600;" th:text="${'₹' + #numbers.formatDecimal(pnl.totalRevenue, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 500;">Total Expenses</td>
                            <td style="text-align: right; color: var(--red-error); font-weight: 600;" th:text="${'₹' + #numbers.formatDecimal(pnl.totalExpenses, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                        </tr>
                        <tr style="background-color: #F8FAFC;">
                            <td style="font-weight: 700; font-size: 1.1rem; padding: 24px;">Net Profit/Loss</td>
                            <td style="text-align: right; font-weight: 700; font-size: 1.1rem; padding: 24px;" th:text="${'₹' + #numbers.formatDecimal(pnl.netProfitLoss, 1, 'COMMA', 2, 'POINT')}" th:style="${pnl.profitable} ? 'color: var(--emerald-success)' : 'color: var(--red-error)'">₹0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>
</body>
</html>
