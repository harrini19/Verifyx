<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Unit Budget')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <h2>Unit Budget</h2>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Unit</th>
                            <th style="text-align: right;">Allocated Budget</th>
                            <th style="text-align: right;">Actual Spending</th>
                            <th style="text-align: right;">Remaining Budget</th>
                            <th style="text-align: center;">Utilization %</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${budgets}">
                            <td th:text="${item.unitName}" style="font-weight: 500; color: var(--navy-deep);">Unit</td>
                            <td style="text-align: right;" th:text="${'₹' + #numbers.formatDecimal(item.allocatedBudget, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                            <td style="text-align: right;" th:text="${'₹' + #numbers.formatDecimal(item.actualSpending, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                            <td style="text-align: right; font-weight: 600;" th:text="${'₹' + #numbers.formatDecimal(item.remainingBudget, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                            <td style="text-align: center;">
                                <div style="display: flex; align-items: center; gap: 10px; justify-content: center;">
                                    <div style="flex-grow: 1; background-color: var(--gray-light); height: 6px; border-radius: 3px; overflow: hidden; min-width: 60px;">
                                        <div th:style="'width: ' + ${item.utilizationPercentage > 100 ? 100 : item.utilizationPercentage} + '%; height: 100%; background-color: ' + (${item.utilizationPercentage > 90 ? 'var(--red-error)' : 'var(--blue-electric)'}) + ';'"></div>
                                    </div>
                                    <span th:text="${#numbers.formatDecimal(item.utilizationPercentage, 1, 1)} + '%'" style="font-weight: 600; font-size: 0.85rem; width: 40px; text-align: right;">0%</span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(budgets)}">
                            <td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                No budget units found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>
</body>
</html>
