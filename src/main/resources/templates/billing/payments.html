<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payments')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <h2>Payments</h2>
                <a th:href="@{/billing/payments/new}" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Register Payment
                </a>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Payment ID</th>
                            <th>Invoice ID</th>
                            <th>Amount</th>
                            <th>Payment Method</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pay : ${payments}">
                            <td th:text="${pay.paymentId}">1</td>
                            <td th:text="${pay.invoiceId}">1</td>
                            <td th:text="${'₹' + #numbers.formatDecimal(pay.amount, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                            <td>
                                <span class="badge badge-info" th:text="${pay.paymentMethod}">Method</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(payments)}">
                            <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                No payments have been registered yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>
</body>
</html>
