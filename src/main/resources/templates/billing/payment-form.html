<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Payment')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <h2>Register Payment</h2>
                <a th:href="@{/billing/payments}" class="btn btn-outline">Back to List</a>
            </div>
            
            <div class="form-container">
                <form th:action="@{/billing/payments/new}" th:object="${paymentRequest}" method="post">
                    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    
                    <div class="form-group">
                        <label>Select Invoice</label>
                        <select th:field="*{invoiceId}" class="form-control" required>
                            <option value="">-- Choose Invoice --</option>
                            <option th:each="inv : ${invoices}" th:value="${inv.invoiceId}" th:text="${inv.invoiceNumber + ' (' + inv.agencyName + ' - ₹' + #numbers.formatDecimal(inv.amount, 1, 'COMMA', 2, 'POINT') + ')'}"></option>
                        </select>
                        <span th:if="${#fields.hasErrors('invoiceId')}" th:errors="*{invoiceId}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="0.00" required/>
                        <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Payment Date</label>
                        <input type="date" th:field="*{paymentDate}" class="form-control" required/>
                        <span th:if="${#fields.hasErrors('paymentDate')}" th:errors="*{paymentDate}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select th:field="*{paymentMethod}" class="form-control" required>
                            <option value="">Select Method</option>
                            <option th:each="method : ${paymentMethods}" th:value="${method}" th:text="${method}"></option>
                        </select>
                        <span th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Bank Account / Ref (Optional)</label>
                        <input type="text" th:field="*{bankAccount}" class="form-control" placeholder="e.g. HDFC-1234"/>
                        <span th:if="${#fields.hasErrors('bankAccount')}" th:errors="*{bankAccount}" style="color:var(--red-error); font-size:12px;"></span>
                    </div>
                    
                    <div style="margin-top: 32px;">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                            Register Payment
                        </button>
                    </div>
                </form>
            </div>
    </div>
</body>
</html>
