# ============================================================
# Blockchain Certificate Verification Platform - Configuration
# ============================================================

spring.application.name=verification

# ============================================================
# H2 Database - File-based persistence
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/certdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console - available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================================
# Server
# ============================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# Logging
# ============================================================
logging.level.com.certificate.verification=INFO
logging.level.org.springframework.web=WARN
